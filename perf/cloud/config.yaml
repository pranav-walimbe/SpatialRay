# SpatialRay perf cloud runner configuration

# S3 bucket for result.txt and the _SUCCESS marker
result_bucket: spatialray-bench-results

# IAM instance profile granting S3 read and result-bucket write
instance_profile: spatialray-perf

region: us-west-2
volume_gb: 80
max_runtime_mins: 30

repo_url: https://github.com/pranav-walimbe/SpatialRay.git
repo_branch: main

# SSM AMI paths for the cpu and gpu nodes
cpu_ami_ssm: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
gpu_ami_ssm: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id

# disaggregated Serve cluster with a fixed per-stage node budget read by launcher and harness
pools:
  decode:
    instance_type: c6i.xlarge
    ami_ssm: cpu_ami_ssm
    nodes: 2
    replicas: 3
    num_cpus: 1
    min_replicas: 1
    max_replicas: 8
  transform:
    instance_type: c6i.2xlarge
    ami_ssm: cpu_ami_ssm
    nodes: 1
    replicas: 2
    num_cpus: 2
    min_replicas: 1
    max_replicas: 2
  inference:
    nodes: 2
    replicas: 1
    min_replicas: 1
    max_replicas: 2
    cpu:
      instance_type: m7i.xlarge
      ami_ssm: cpu_ami_ssm
      num_cpus: 1
    gpu:
      instance_type: g4dn.xlarge
      ami_ssm: gpu_ami_ssm
      num_cpus: 1
      num_gpus: 1

# dynamic-policy inputs
controller:
  tick_s: 12.0
  warmup_s: 60.0
  decode_target_ongoing_requests: 8.0
  transform_util_target: 0.7
  inference_util_target: 0.7
